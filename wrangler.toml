# wrangler.toml — Cloudflare Workers config for mynoosaheads.com (OpenNext)
# Generated by Dexter for MSN-2962 (Tim directive 2026-08-28 09:25 BST
# — "put it on cloudfare"). See /Volumes/OpenClawLive/state/control/evidence/MSN-2962/
#
# This file is read by `wrangler dev` / `wrangler deploy` for the
# @opennextjs/cloudflare Worker. The Worker URL will be:
#   https://mynoosaheads.<account-subdomain>.workers.dev
#
# For a `*.pages.dev` URL, use the Pages scripts (npm run pages:build
# + pages:deploy) — those use @cloudflare/next-on-pages instead of
# OpenNext and deploy via `wrangler pages deploy`. The Pages path
# requires `export const runtime = "edge"` in the root layout (set up
# via `npm run pages:enable`). See the package.json `scripts` block.
#
# Compatibility flags:
#   - nodejs_compat: required for @opennextjs/cloudflare (uses a small
#     number of Node APIs at request time: Buffer, process, util).
#   - global_fetch_strictly_public: not enabled here; outbound fetch
#     to Open-Meteo / Wikimedia Commons / Sentry is treated as public.

name = "mynoosaheads"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Workers Observability — opt-in; can be toggled later.
# [observability]
# enabled = true

# Static assets — bundled by OpenNext during `wrangler deploy`. The
# directory is produced by `npx @opennextjs/cloudflare build` under
# `.open-next/assets/`.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Runtime vars (non-secret). Cloudflare Workers picks these up at deploy.
[vars]
CF_PAGES = "1"
NODE_VERSION = "20"